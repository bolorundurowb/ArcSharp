<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">ArcSharp</title>
  <desc id="desc">An open ring around a sharp sign. The ring is a reference count, and the detached dot is a reference being released.</desc>
  <defs>
    <linearGradient id="arcsharp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B4DFF"/>
      <stop offset="1" stop-color="#3A1C9E"/>
    </linearGradient>
    <linearGradient id="arcsharp-ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3EE6C1"/>
      <stop offset="1" stop-color="#9AF5E0"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#arcsharp-bg)"/>
  <path d="M104.57 53.13 A42 42 0 1 1 74.87 23.43" fill="none" stroke="url(#arcsharp-ring)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="93.7" cy="34.3" r="6.5" fill="#FFB547"/>
  <g stroke="#FFFFFF" stroke-width="7" stroke-linecap="round">
    <line x1="58" y1="45" x2="53" y2="83"/>
    <line x1="75" y1="45" x2="70" y2="83"/>
    <line x1="45" y1="57" x2="84" y2="57"/>
    <line x1="43" y1="71" x2="82" y2="71"/>
  </g>
</svg>
