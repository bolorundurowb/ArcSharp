name: Verify samples

on:
    pull_request:
        branches: [master]

permissions:
    contents: read

jobs:
    verify-samples:
        name: Verify samples (Windows x64)
        runs-on: windows-2025
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: actions/setup-dotnet@v6
              with:
                  global-json-file: global.json

            - name: Run verification harness
              shell: pwsh
              run: .\tools\verify.ps1
